
<!DOCTYPE html>
<html>
    <head>
        {%metas%}
        <title>{%title%}</title>
        {%favicon%}
        {%css%}
        <style>
            /* Light Theme */
            .theme-light {
                --bg-primary: #ffffff;
                --bg-secondary: #f8f9fa;
                --text-primary: #212529;
                --text-secondary: #6c757d;
                --border-color: #dee2e6;
                --card-bg: #ffffff;
                --shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            }
            
            /* Dark Theme */
            .theme-dark {
                --bg-primary: #1a1a1a;
                --bg-secondary: #2d2d2d;
                --text-primary: #ffffff;
                --text-secondary: #adb5bd;
                --border-color: #495057;
                --card-bg: #2d2d2d;
                --shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.3);
            }

            /* Dark theme table styling */
            .theme-dark .dash-table-container {
                background-color: #1a1a1a !important;
            }

            .theme-dark .dash-table-container .dash-spreadsheet-container {
                background-color: #1a1a1a !important;
            }

            .theme-dark .dash-table-container .dash-spreadsheet-container .dash-spreadsheet-inner {
                background-color: #1a1a1a !important;
            }

            .theme-dark .dash-table-container .dash-spreadsheet-container .dash-spreadsheet-inner table {
                background-color: #1a1a1a !important;
                color: #ffffff !important;
            }

            .theme-dark .dash-table-container .dash-spreadsheet-container .dash-spreadsheet-inner table th {
                background-color: #2d2d2d !important;
                color: #ffffff !important;
                border-color: #495057 !important;
            }

            .theme-dark .dash-table-container .dash-spreadsheet-container .dash-spreadsheet-inner table td {
                background-color: #1a1a1a !important;
                color: #ffffff !important;
                border-color: #495057 !important;
            }

            .theme-dark .dash-table-container .dash-spreadsheet-container .dash-spreadsheet-inner table tr:nth-child(even) td {
                background-color: #2a2a2a !important;
            }

            .theme-dark .dash-table-container .dash-spreadsheet-container .dash-spreadsheet-inner table tr:hover td {
                background-color: #333333 !important;
            }
            /* Dark theme dropdown styling */
            .theme-dark .Select-control {
                background-color: #2d2d2d !important;
                border-color: #495057 !important;
                color: #ffffff !important;
            }

            .theme-dark .Select-control:hover {
                border-color: #6c757d !important;
            }

            .theme-dark .Select-control.is-focused {
                border-color: #667eea !important;
                box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25) !important;
            }

            .theme-dark .Select-placeholder {
                color: #adb5bd !important;
            }

            .theme-dark .Select-input > input {
                color: #ffffff !important;
            }

            .theme-dark .Select-value-label {
                color: #ffffff !important;
            }

            .theme-dark .Select-arrow-zone {
                color: #adb5bd !important;
            }

            .theme-dark .Select-menu-outer {
                background-color: #2d2d2d !important;
                border-color: #495057 !important;
                box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.4) !important;
            }

            .theme-dark .Select-menu {
                background-color: #2d2d2d !important;
            }

            .theme-dark .Select-option {
                background-color: #2d2d2d !important;
                color: #ffffff !important;
            }

            .theme-dark .Select-option.is-focused {
                background-color: #495057 !important;
                color: #ffffff !important;
            }

            .theme-dark .Select-option.is-selected {
                background-color: #667eea !important;
                color: #ffffff !important;
            }

            .theme-dark .Select-clear-zone {
                color: #adb5bd !important;
            }

            .theme-dark .Select-clear-zone:hover {
                color: #ffffff !important;
            }

            /* Alternative dropdown selectors (newer Dash versions) */
            .theme-dark .dash-dropdown .Select-control {
                background-color: #2d2d2d !important;
                border-color: #495057 !important;
                color: #ffffff !important;
            }

            .theme-dark .dash-dropdown .Select-menu-outer {
                background-color: #2d2d2d !important;
                border-color: #495057 !important;
            }

            .theme-dark .dash-dropdown .Select-option {
                background-color: #2d2d2d !important;
                color: #ffffff !important;
            }

            .theme-dark .dash-dropdown .Select-option:hover {
                background-color: #495057 !important;
            }







            
            /* Apply theme variables */
            body {
                background-color: var(--bg-primary) !important;
                color: var(--text-primary) !important;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
                transition: all 0.3s ease;
            }
            
            #main-container {
                background-color: var(--bg-primary);
                color: var(--text-primary);
            }
            
            #main-title {
                color: var(--text-primary) !important;
                font-size: 2.5rem !important;
            }
            
            #main-subtitle {
                color: var(--text-secondary) !important;
            }
            
            /* Card styling */
            .card {
                background-color: var(--card-bg) !important;
                border: 1px solid var(--border-color) !important;
                box-shadow: var(--shadow) !important;
                border-radius: 0.5rem !important;
            }
            
            .card-header {
                background-color: var(--bg-secondary) !important;
                border-bottom: 1px solid var(--border-color) !important;
                color: var(--text-primary) !important;
            }
            
            .card-body {
                color: var(--text-primary) !important;
            }

            /* Enhanced form controls */
            .Select-control, .dropdown {
                border-radius: 10px !important;
                border: 2px solid rgba(102, 126, 234, 0.2) !important;
                box-shadow: 0 2px 8px rgba(102, 126, 234, 0.1) !important;
                transition: all 0.3s ease !important;
            }

            .Select-control:hover, .dropdown:hover {
                border-color: rgba(102, 126, 234, 0.4) !important;
                box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2) !important;
            }

            /* Slider styling */
            .rc-slider-track {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
                height: 6px !important;
            }

            .rc-slider-handle {
                border: 3px solid #667eea !important;
                background: white !important;
                width: 20px !important;
                height: 20px !important;
                margin-top: -7px !important;
                box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3) !important;
            }

            .rc-slider-rail {
                background: rgba(102, 126, 234, 0.2) !important;
                height: 6px !important;
            }

            /* Checkbox styling */
            input[type="checkbox"] {
                accent-color: #667eea !important;
                width: 18px !important;
                height: 18px !important;
            }

            /* Button hover effect */
            .btn:hover {
                transform: translateY(-2px) !important;
                box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4) !important;
            }            
            /* Tab styling */
            .nav-tabs {
                border-bottom: 1px solid var(--border-color) !important;
            }

            .nav-tabs .nav-link {
                color: var(--text-secondary) !important;
                border: none !important;
                background: transparent !important;
                font-weight: 600 !important;
                fontSize: 1.1rem !important;
            }

            .nav-tabs .nav-link.active {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
                -webkit-background-clip: text !important;
                -webkit-text-fill-color: transparent !important;
                background-clip: text !important;
                border: none !important;
                border-bottom: 3px solid transparent !important;
                background-image: linear-gradient(135deg, #667eea 0%, #764ba2 100%), linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
                background-size: 100% 100%, 100% 3px !important;
                background-position: 0 0, 0 100% !important;
                background-repeat: no-repeat !important;
                font-weight: 700 !important;
            }
            /* Button styling */
            .btn {
                border-radius: 0.375rem !important;
                font-weight: 500 !important;
                transition: all 0.2s ease !important;
            }
            
            .btn-outline-secondary {
                color: var(--text-secondary) !important;
                border-color: var(--border-color) !important;
            }
            
            .btn-outline-secondary:hover {
                background-color: var(--bg-secondary) !important;
                color: var(--text-primary) !important;
            }
            
            /* Plot container styling */
            .js-plotly-plot {
                border-radius: 0.5rem !important;
                box-shadow: var(--shadow) !important;
            }
            
            /* Table styling */
            .dash-table-container {
                background-color: var(--card-bg) !important;
                border-radius: 0.5rem !important;
                overflow: hidden !important;
            }
            
            /* Progress bar */
            .progress {
                background-color: var(--bg-secondary) !important;
                border-radius: 0.5rem !important;
            }
            
            /* Input styling */
            .form-control, .form-select {
                background-color: var(--card-bg) !important;
                border: 1px solid var(--border-color) !important;
                color: var(--text-primary) !important;
            }
            
            .form-control:focus, .form-select:focus {
                background-color: var(--card-bg) !important;
                border-color: #007bff !important;
                color: var(--text-primary) !important;
            }
        </style>
    </head>
    <body class="theme-light">
        {%app_entry%}
        <footer>
            {%config%}
            {%scripts%}
            {%renderer%}
        </footer>
    </body>
</html>
